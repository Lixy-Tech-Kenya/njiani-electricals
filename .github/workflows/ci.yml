name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type-check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: njiani
          POSTGRES_PASSWORD: njiani_pass
          POSTGRES_DB: njiani_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://njiani:njiani_pass@localhost:5432/njiani_db
      JWT_SECRET: ci_test_secret_key_min_32_chars_long
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @njiani/shared build

      - name: Run Prisma migrations
        working-directory: apps/backend
        run: pnpm prisma migrate deploy

      - name: Type-check backend
        run: pnpm --filter @njiani/backend tsc --noEmit

      - name: Type-check admin
        run: pnpm --filter @njiani/admin tsc --noEmit

      - name: Type-check web
        run: pnpm --filter @njiani/web tsc --noEmit

      - name: Build backend
        run: pnpm --filter @njiani/backend build

      - name: Build admin
        run: pnpm --filter @njiani/admin build

      - name: Build web
        run: pnpm --filter @njiani/web build

      - name: Run backend tests
        run: pnpm --filter @njiani/backend test --passWithNoTests
