services:
  postgres:
    image: postgres:16-alpine
    container_name: njiani-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-njiani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-njiani_pass}
      POSTGRES_DB: ${POSTGRES_DB:-njiani_db}
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U njiani']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: njiani-redis
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: njiani-adminer
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
